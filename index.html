<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Obra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #292929;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            padding: 25px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        button,
        .camera-label {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #292929;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            text-align: center;
        }

        button:hover,
        .camera-label:hover {
            opacity: 0.9;
        }

        .status {
            margin-top: 12px;
            padding: 10px;
            background: #f1f1f1;
            border-radius: 8px;
            font-size: 14px;
            word-break: break-word;
        }

        #foto {
            display: none;
        }

        #preview {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            display: none;
        }

        .enviar {
            background: #f03c23;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Registro de Obra</h1>

    <!-- UBICACIÓN -->
    <div class="card">

        <span class="label">📍 Ubicación</span>

        <button type="button" onclick="obtenerUbicacion()">
            Obtener ubicación
        </button>

        <div id="ubicacionStatus" class="status">
            Ubicación no registrada
        </div>

    </div>


    <!-- FOTO -->
    <div class="card">

        <span class="label">📷 Tomar foto</span>

        <label for="foto" class="camera-label">
            Abrir cámara
        </label>

        <!-- capture="environment" intenta abrir la cámara trasera -->
        <input
            type="file"
            id="foto"
            accept="image/*"
            capture="environment"
            onchange="mostrarFoto(event)"
        >

        <img id="preview">

    </div>


    <!-- ENVIAR -->
    <button
        type="button"
        class="enviar"
        onclick="enviarRegistro()"
    >
        ENVIAR
    </button>

</div>


<script>

    let latitud = null;
    let longitud = null;
    let precision = null;
    let fotoSeleccionada = null;


    // ==========================
    // OBTENER UBICACIÓN
    // ==========================

    function obtenerUbicacion() {

        const status = document.getElementById("ubicacionStatus");

        if (!navigator.geolocation) {

            status.innerHTML =
                "❌ Este dispositivo no soporta geolocalización.";

            return;
        }

        status.innerHTML =
            "📍 Obteniendo ubicación...";

        navigator.geolocation.getCurrentPosition(

            function(position) {

                latitud = position.coords.latitude;
                longitud = position.coords.longitude;
                precision = position.coords.accuracy;

                status.innerHTML = `
                    <strong>Ubicación obtenida</strong><br><br>

                    Latitud: ${latitud}<br>

                    Longitud: ${longitud}<br>

                    Precisión: ${precision.toFixed(2)} metros
                `;

            },

            function(error) {

                switch(error.code) {

                    case error.PERMISSION_DENIED:

                        status.innerHTML =
                            "❌ Debes permitir el acceso a la ubicación.";

                        break;

                    case error.POSITION_UNAVAILABLE:

                        status.innerHTML =
                            "❌ No se pudo obtener la ubicación.";

                        break;

                    case error.TIMEOUT:

                        status.innerHTML =
                            "❌ Tiempo de espera agotado.";

                        break;

                    default:

                        status.innerHTML =
                            "❌ Error desconocido.";

                }

            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }

        );
    }


    // ==========================
    // TOMAR FOTO
    // ==========================

    function mostrarFoto(event) {

        const archivo = event.target.files[0];

        if (!archivo) {
            return;
        }

        fotoSeleccionada = archivo;

        const preview = document.getElementById("preview");

        preview.src = URL.createObjectURL(archivo);

        preview.style.display = "block";
    }


    // ==========================
    // ENVIAR
    // ==========================

    function enviarRegistro() {

        if (!latitud || !longitud) {

            alert("Primero debes obtener la ubicación.");

            return;
        }

        if (!fotoSeleccionada) {

            alert("Primero debes tomar una foto.");

            return;
        }

        alert(`
Registro listo para enviar.

Latitud: ${latitud}

Longitud: ${longitud}

Precisión: ${precision.toFixed(2)} metros

Foto: ${fotoSeleccionada.name}
        `);

        // Aquí posteriormente podemos enviar
        // la información a PHP + MySQL.

    }

</script>

</body>
</html>
