<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Control de operarios</title>
    <style>
        :root {
            --azul: #31629a;
            --amarillo: #f5c223;
            --blanco: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: var(--azul);
        }

        .login {
            width: min(100%, 390px);
            padding: 38px 34px 34px;
            background: var(--blanco);
            border-top: 9px solid var(--amarillo);
            border-radius: 14px;
            box-shadow: 0 18px 45px rgba(20, 45, 80, 0.25);
        }

        h1 {
            margin: 0 0 28px;
            color: var(--azul);
            font-size: 28px;
            text-align: center;
        }

        .campo {
            display: block;
            margin-bottom: 18px;
            color: var(--azul);
            font-size: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            margin-top: 8px;
            padding: 13px 14px;
            border: 2px solid #d7e0eb;
            border-radius: 7px;
            color: #1f2f43;
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--azul);
            box-shadow: 0 0 0 3px rgba(245, 194, 35, 0.35);
        }

        button {
            width: 100%;
            margin-top: 6px;
            padding: 14px;
            border: 0;
            border-radius: 7px;
            background: var(--amarillo);
            color: #233b5a;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e8b713;
        }

        button:focus-visible {
            outline: 3px solid var(--azul);
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main class="login">
        <h1>Iniciar sesión</h1>
        <form action="entrada.html" method="get">
            <label class="campo" for="usuario">
                Usuario
                <input type="text" id="usuario" name="usuario" autocomplete="username" required>
            </label>

            <label class="campo" for="contrasena">
                Contraseña
                <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
            </label>

            <button type="submit">ENTRAR</button>
        </form>
    </main>
</body>
</html>
